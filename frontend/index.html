const API="http://127.0.0.1:5000/api/analyze";
let prevTopic="net",busy=false,cErr="",unc=[];
UI.demo=["Sample diagrams have hand-made clickable regions. Your own uploads are analysed by the Gemma 4 backend at 127.0.0.1:5000 (run python app.py first).","नमूना चित्रों में हाथ से बने क्लिक करने योग्य हिस्से हैं। आपकी अपनी तस्वीर Gemma 4 बैकएंड (127.0.0.1:5000) पढ़ता है; पहले python app.py चलाएँ।"];

const _explain=explain;
explain=function(){
  if(!custom)return _explain();
  if(busy)return`<p>⏳ ${L?"विश्लेषण हो रहा है… (लोकल मॉडल में 1-2 मिनट लग सकते हैं)":"Analysing… (a local model can take 1-2 minutes)"}</p>`;
  if(cErr)return`<p>❌ ${esc(cErr)}</p>`;
  if(topic!=="custom")return`<p>${t("demo")}</p>`;
  let h=`<h3><span class="hl">${esc(T.custom.ti[0])}</span></h3><p>${esc(T.custom.ov[0])}</p>`;
  Object.values(D).forEach(c=>{h+=`<p><b>${esc(c.n[0])}:</b> ${esc(c.s[0])}</p>`});
  if(unc.length){h+=`<h4>⚠️ ${L?"AI को इन पर पक्का नहीं है":"The AI is not sure about these"}</h4>`+unc.map(u=>`<div class="note">${esc(u)}</div>`).join("")}
  return h;
};

const _game=game;
game=function(){
  if(custom)return`<p>${L?"चुनौती सिर्फ़ नमूना चित्रों के लिए है।":"Challenge works on the sample diagrams only."}</p>`;
  return _game();
};

$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(topic!=="custom")prevTopic=topic;
  custom=true;busy=true;cErr="";sel=null;tab=0;
  const url=URL.createObjectURL(f);
  const show=()=>{$("stage").innerHTML=`<img class="prev" alt="Uploaded diagram" src="${url}">`};
  render();show();
  $("ana").textContent=L?"⏳ विश्लेषण हो रहा है…":"⏳ Analysing…";
  const fd=new FormData();
  fd.append("image",f);
  fd.append("lang",L?"Hindi":"English");
  fd.append("level",["Beginner","Intermediate","Advanced"][lvl]);
  try{
    const r=await fetch(API,{method:"POST",body:fd});
    let j;
    try{j=await r.json()}catch{throw new Error((L?"बैकएंड से गलत जवाब (status ":"Bad reply from backend (status ")+r.status+")")}
    if(j.error)throw new Error(j.error);
    const Dn={};
    (j.components||[]).forEach((c,i)=>{const n=[c.name,c.name],x=[c.explanation,c.explanation];Dn["c"+i]={n,s:x,d:x,a:x}});
    const Qn=(j.quiz||[]).map(q=>({q:[q.q,q.q],o:q.options.map(o=>[o,o]),a:q.answer}));
    const Nn=(j.notes||[]).map(n=>[n,n]);
    unc=(j.uncertain||[]).filter(u=>u&&!/^(none|n\/a|nil|-)\.?$/i.test(String(u).trim()));
    T.custom={D:Dn,Q:Qn,NOTES:Nn,dia:"",tab:[j.topic,j.topic],ti:[j.topic,j.topic],ov:[j.summary,j.summary]};
    topic="custom";({D,Q,NOTES,dia}=T.custom);qi=0;score=0;gm=null;chat=[];
  }catch(err){
    cErr=err.message==="Failed to fetch"?(L?"बैकएंड नहीं मिला। क्या python app.py चल रहा है?":"Cannot reach the backend. Is python app.py running?"):err.message;
  }
  busy=false;e.target.value="";render();show();
};

$("back").onclick=()=>{
  custom=false;busy=false;cErr="";$("file").value="";
  topic=prevTopic;({D,Q,NOTES,dia}=T[topic]);qi=0;score=0;sel=null;gm=null;render();
};
/* ========================================================================== */

render();analyze();
</script>
</body>
</html>
