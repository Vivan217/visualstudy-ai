<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FieldScout AI</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  p.sub { color: #999; margin-top: 0; margin-bottom: 28px; }
  textarea, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1d24; color: #eee; margin-bottom: 10px; box-sizing: border-box; font-size: 14px; }
  button { background: #4f7cff; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:hover { background: #3a63e0; }
  .card { background: #1a1d24; border: 1px solid #2a2d34; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .low { background: #1e3a2a; color: #4ade80; }
  .medium { background: #3a331e; color: #facc15; }
  .high { background: #3a1e1e; color: #f87171; }
  .dup { color: #f87171; font-size: 13px; margin-top: 6px; }
  .score { float: right; color: #999; font-size: 13px; }
  #status { font-size: 13px; color: #999; margin-top: 6px; }
</style>
</head>
<body>

<h1>FieldScout AI</h1>
<p class="sub">Field Report → Structured Dealer Intelligence Pipeline</p>

<input id="agentId" placeholder="Agent name (e.g. agent_jyotirmoy)" value="agent_jyotirmoy" />
<textarea id="reportText" rows="3" placeholder="Paste field report text here..."></textarea>
<button onclick="submitReport()">Submit Report</button>
<div id="status"></div>

<h2 style="margin-top:36px;">Ranked Dealer Queue</h2>
<div id="dealerList"></div>

<script>
  const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
  ? "http://localhost:8000"
  : "https://visualstudy-ai.onrender.com";

  async function submitReport() {
    const agentId = document.getElementById("agentId").value.trim();
    const text = document.getElementById("reportText").value.trim();
    const status = document.getElementById("status");
    if (!text) { status.textContent = "Enter some report text first."; return; }

    status.textContent = "Submitting...";
    try {
      const res = await fetch(`${API_BASE}/reports`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent_id: agentId, text }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(data));
      status.textContent = `Submitted ✓ (id: ${data.id})`;
      document.getElementById("reportText").value = "";
      loadDealers();
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  }

  async function loadDealers() {
    const res = await fetch(`${API_BASE}/dealers/ranked`);
    const dealers = await res.json();
    const list = document.getElementById("dealerList");
    if (dealers.length === 0) {
      list.innerHTML = "<p style='color:#666'>No dealers yet — submit a report above.</p>";
      return;
    }
    list.innerHTML = dealers.map(d => `
      <div class="card">
        <span class="badge ${d.risk_band}">${d.risk_band.toUpperCase()}</span>
        <span class="score">score: ${d.viability_score}</span>
        <div style="margin-top:8px; font-weight:600;">${d.shop_type || "Unknown shop type"}</div>
        <div style="color:#aaa; font-size:13px;">${d.location || "Location not extracted"}</div>
        <div style="color:#888; font-size:12px; margin-top:4px;">Agent: ${d.agent_id} • Stock: ${(d.stock_signals || []).join(", ") || "—"}</div>
      </div>
    `).join("");
  }

  loadDealers();
</script>
</body>
</html>
